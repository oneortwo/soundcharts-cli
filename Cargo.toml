[package]
name = "cli-soundcharts"
version = "0.1.0"
edition = "2021"
description = "CLI for the Soundcharts API"
license = "MIT"

[[bin]]
name = "sc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dialoguer = "0.11"
console = "0.15"
comfy-table = "7"
dirs = "6"
self_update = { version = "0.42", features = ["archive-tar", "compression-flate2", "signatures"] }
urlencoding = "2"
