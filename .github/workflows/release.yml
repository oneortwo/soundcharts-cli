name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute CalVer tag
        id: version
        run: |
          today="v$(date -u +%Y.%m.%d)"
          existing=$(git tag -l "${today}*" | sort -V | tail -1)
          if [ -z "$existing" ]; then
            tag="$today"
          elif [ "$existing" = "$today" ]; then
            tag="${today}.2"
          else
            n="${existing##*.}"
            next=$((n + 1))
            tag="${today}.${next}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Version: $tag"

      - name: Create tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

  build:
    needs: version
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            archive: zip

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../sc-${{ matrix.target }}.tar.gz sc
          cd ../../..

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/sc.exe" -DestinationPath "sc-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sc-${{ matrix.target }}
          path: sc-${{ matrix.target }}.${{ matrix.archive }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Extract changelog
        id: changelog
        run: |
          # Extract the first version section from CHANGELOG.md (between first and second ## headings)
          notes=$(awk 'BEGIN{f=0} /^## [0-9]/{if(f){exit}; f=1; next} /^## /{if(f){exit}; next} f{print}' CHANGELOG.md)
          if [ -z "$notes" ]; then
            notes="See [CHANGELOG.md](https://github.com/oneortwo/soundcharts-cli/blob/main/CHANGELOG.md) for details."
          fi
          # Write to file to avoid quoting issues
          echo "$notes" > /tmp/release-notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: /tmp/release-notes.md
          files: |
            sc-*.tar.gz
            sc-*.zip
